project:
  type: website
  output-dir: docs
  resources:
    - static/

website:
  title: "ECE 484 Drone Race by ZJUI Meta"
  navbar:
    background: light
    left:
      - text: "Team Github"
        menu:
          - text: "Site Github"
            href: https://github.com/safeautonomy-illinois-students/fa26_ece484_final_project_site_team_ZJUI_Meta
          - text: "Project Github"
            href: https://github.com/safeautonomy-illinois-students/fa26_ece484_final_project_code_team_ZJUI_Meta

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: false
    page-layout: full
    code-copy: true
    html-math-method: mathjax
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
